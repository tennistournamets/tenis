<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)" />
    <script>
      // Тема до первой отрисовки: сохранённая или системная
      (function () {
        var t
        try { t = localStorage.getItem('champ_theme') } catch (e) { /* ignore */ }
        // The club-site widget follows the host page (?theme= from embed.js) without saving it.
        if (location.pathname.indexOf('/embed/') === 0) {
          var q = /[?&]theme=(light|dark)/.exec(location.search)
          if (q) t = q[1]
        }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- A <link> instead of a CSS @import: fonts start loading in parallel with the app CSS. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Bracketa" />
    <!-- seo:start -->
    <!-- Dev/SPA defaults. The build (scripts/prerender.mjs) rewrites this block per page from src/lib/seo.js. -->
    <title>Bracketa</title>
    <meta name="description" content="Nemokama programa teniso, padelio ir futbolo turnyrams: dalyvių registracija, turnyrų tinklelis, rezultatai tiesiogiai ir kortų tvarkaraštis. Žiūrovams paskyros nereikia." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bracketa" />
    <meta property="og:title" content="Bracketa — teniso, padelio ir futbolo turnyrai" />
    <meta property="og:image" content="__SITE_ORIGIN__/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- seo:end -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
